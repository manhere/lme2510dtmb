name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_VER: 0.2.0-1
  # Prebuilt arm64 kernel headers matching the target platform
  # (HiSilicon-Development firmware release "kernel").
  HEADERS_BASE_URL: https://github.com/HiSilicon-Development/firmware/releases/download/kernel

jobs:
  aarch64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Build all four header variants on every run; the deb filename
        # carries the kernel release (dvbip-XXXX) so assets coexist.
        variant: [ '1001', '1002', '1004', '1006' ]
    env:
      HEADERS_DEB_URL: >-
        ${{ env.HEADERS_BASE_URL }}/linux-headers-6.12.112-dvbip-${{ matrix.variant }}_6.12.112-1_arm64.deb

    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev

      # The headers .deb ships arm64 host tools (scripts/fixdep etc.);
      # register qemu binfmt so they run on the x86_64 runner.
      - name: Set up QEMU binfmt (aarch64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Extract target kernel headers (dvbip-${{ matrix.variant }})
        run: |
          mkdir -p /tmp/hdr
          curl -fSL --retry 3 -o /tmp/hdr/headers.deb "$HEADERS_DEB_URL"
          dpkg-deb -x /tmp/hdr/headers.deb /tmp/hdr/rootfs
          KDIR="$(find /tmp/hdr/rootfs/usr/src -maxdepth 1 -type d -name 'linux-headers-*' | head -n1)"
          test -n "$KDIR" || { echo "headers dir not found"; exit 1; }
          KREL="$(basename "$KDIR" | sed 's/^linux-headers-//')"
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          echo "KREL=$KREL" >> "$GITHUB_ENV"
          echo "kernel headers: $KDIR (release $KREL)"

      - name: Build module (aarch64)
        run: |
          make KERNEL_SRC="$KDIR" ARCH=arm64 \
               CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)"
          file lme2510dtmb.ko
          aarch64-linux-gnu-readelf -h lme2510dtmb.ko | grep -E 'Class|Machine'

      - name: Build firmware blob
        run: make dvb-usb-lme2510dtmb.fw

      - name: Package .deb
        run: |
          set -e
          mkdir -p pkg/DEBIAN
          mkdir -p "pkg/lib/modules/$KREL/kernel/drivers/media/usb"
          mkdir -p pkg/lib/firmware
          mkdir -p pkg/etc/modprobe.d

          install -m 0644 lme2510dtmb.ko \
            "pkg/lib/modules/$KREL/kernel/drivers/media/usb/lme2510dtmb.ko"
          install -m 0644 dvb-usb-lme2510dtmb.fw pkg/lib/firmware/

          cat > pkg/etc/modprobe.d/lme2510dtmb.conf <<'EOF'
          # Blacklist lmedm04 — conflicts with lme2510dtmb (same VID/PID)
          blacklist dvb_usb_lmedm04
          install dvb_usb_lmedm04 /bin/false
          # lme2510dtmb module parameters (edit as needed, then replug/reload)
          options lme2510dtmb ep8a_status=1 debug_lgs8gl5=0 debug_max2165=0
          EOF

          cat > pkg/DEBIAN/control <<EOF
          Package: lme2510dtmb
          Version: ${PKG_VER}
          Section: kernel
          Priority: optional
          Architecture: arm64
          Maintainer: dabing <manhere@users.noreply.github.com>
          Description: LME2510 DTMB USB dongle DVB driver (kernel ${KREL})
           Out-of-tree dvb-usb-v2 driver for the LME2510C/LME2511 DTMB stick
           (LGS8GL5 demodulator + MAX2165 tuner). Installs the prebuilt
           kernel module for kernel ${KREL}, the firmware blob and a
           modprobe blacklist for the conflicting in-tree lmedm04 driver.
          EOF

          cat > pkg/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          depmod -a "__KREL__" 2>/dev/null || depmod -a
          echo "lme2510dtmb installed. Load with: sudo modprobe lme2510dtmb"
          EOF

          cat > pkg/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          set -e
          depmod -a "__KREL__" 2>/dev/null || depmod -a || true
          EOF

          sed -i "s/__KREL__/$KREL/g" pkg/DEBIAN/postinst pkg/DEBIAN/postrm
          chmod 755 pkg/DEBIAN/postinst pkg/DEBIAN/postrm

          DEB="lme2510dtmb_${PKG_VER}_${KREL}_arm64.deb"
          dpkg-deb --build --root-owner-group pkg "$DEB"
          dpkg-deb --info "$DEB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lme2510dtmb-${{ env.KREL }}-aarch64-deb
          path: lme2510dtmb_*.deb
          if-no-files-found: error

  # Publish only after ALL variants built successfully; one job uploads
  # every deb so matrix jobs never race on the same release.
  release:
    if: github.event_name != 'pull_request'
    needs: aarch64
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Collect all variant debs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lme2510dtmb-*-aarch64-deb
          merge-multiple: true

      - name: Publish to GitHub Release
        run: |
          cd dist
          ls -l *.deb
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            gh release create "$TAG" *.deb \
              --title "lme2510dtmb $TAG" \
              --generate-notes \
            || gh release upload "$TAG" *.deb --clobber
          else
            TAG="latest"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --title "lme2510dtmb latest" \
                --notes "Rolling builds of \`main\` (arm64), one deb per supported kernel variant.

          Install the one matching your kernel (uname -r):
              sudo dpkg -i lme2510dtmb_*_6.12.112-dvbip-<variant>_arm64.deb
              sudo modprobe lme2510dtmb

          Variants: dvbip-1001 / 1002 / 1004 / 1006.
          Commit: ${{ github.sha }}" \
                --prerelease
            fi
            gh release upload "$TAG" *.deb --clobber
          fi
